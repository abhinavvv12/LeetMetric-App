<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="main-container">

        <h1>LeetMetric App</h1>

        <div class="user-input-field">
            <p>Enter your username below: </p>
            <div class="user-input">
                <input type="text" placeholder="Enter your username" id="user-input" >
                <button id="user-btn" >Search</button>
            </div>
        </div>

        <div class="stats-container">
            <div class="progress">
                <div class="progress-item">
                    <div class="easy-progress circle">
                        <span id="easy-label">
                            Easy
                        </span>
                    </div>
                </div>
                <div class="progress-item ">
                    <div class="medium-progress circle ">
                        <span id="medium-label">
                            Medium
                        </span>
                    </div>
                </div>
                <div class="progress-item ">
                    <div class="hard-progress circle">
                        <span id="hard-label">
                            Hard
                        </span>
                    </div>
                </div>
            </div>

        </div>
        <div class="stats-card">
             
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
